[package]
name = "proxyres"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Cross-platform proxy resolution"
repository = "https://github.com/proxyres/proxyres-rs"
readme = "README.md"
keywords = ["proxy", "pac", "wpad"]
categories = ["network-programming"]

[dependencies]
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[package]
name = "proxyres"
version = "1.5.6"
edition = "2024"
rust-version = "1.85"
license = "MIT AND MPL-2.0"
description = "Cross-platform proxy resolution"
repository = "https://github.com/proxyres/proxyres-rs"
readme = "README.md"
keywords = ["proxy", "pac", "wpad"]
categories = ["network-programming"]
exclude = [".github/"]

[workspace]
members = ["capi", "cli"]

[features]
default = []
# Execute PAC scripts with the bundled QuickJS engine instead of the system engine
quickjs = ["dep:rquickjs"]
# Download PAC scripts using HTTPS on Linux and Windows, verified with the operating system's certificate
# store. macOS and iOS always download PAC scripts with CFNetwork, which supports HTTPS.
https = ["dep:ureq"]

[dependencies]
log = "0.4"
rquickjs = { version = "0.14", optional = true }

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "ios"))'.dependencies]
libloading = "0.9"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
core-foundation-sys = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug_ActiveScript",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }
windows-core = "0.62"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_Dhcp",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinInet",
    "Win32_Networking_WinSock",
    "Win32_System_SystemInformation",
] }

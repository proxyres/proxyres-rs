name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, also the tag, e.g. 1.5.6
        required: true
        type: string
      ref:
        description: Commit, tag, or branch to build
        required: true
        type: string
        default: main
env:
  TERM: xterm-256color
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    # Every crate in the workspace carries the version, and a release must match all of them.
    - name: Version matches the sources
      run: |
        want="${{ inputs.version }}"
        out=$(cargo metadata --no-deps --format-version 1 | jq -r --arg want "$want" \
          '.packages[] | select(.version != $want) | "\(.name) is \(.version), not \($want)"')
        if [ -n "$out" ]; then
          echo "$out"
          exit 1
        fi
        if git ls-remote --exit-code origin "refs/tags/$want" > /dev/null; then
          echo "tag $want already exists"
          exit 1
        fi
        if curl -sf -A "proxyres-rs release workflow" "https://crates.io/api/v1/crates/proxyres/$want" > /dev/null; then
          echo "proxyres $want is already on crates.io"
          exit 1
        fi

    - name: Check the crate package
      run: cargo publish --dry-run -p proxyres

    - name: Resolve the commit
      id: commit
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # The oldest runner is used so the binary runs on older glibc versions.
          - name: Build - Ubuntu x86_64
            runs-on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            packages: libjavascriptcoregtk-4.1-dev gsettings-desktop-schemas
            arch: linux-x86_64

          - name: Build - Ubuntu ARM64
            runs-on: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            packages: libjavascriptcoregtk-4.1-dev gsettings-desktop-schemas
            arch: linux-arm64

          - name: Build - macOS ARM64
            runs-on: macos-latest
            target: aarch64-apple-darwin
            arch: macos-arm64

          - name: Build - macOS x86_64
            runs-on: macos-latest
            target: x86_64-apple-darwin
            arch: macos-x86_64
            skip-tests: true

          - name: Build - Windows x64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
            arch: windows-x64

          - name: Build - Windows x86
            runs-on: windows-latest
            target: i686-pc-windows-msvc
            arch: windows-x86

    steps:
    - name: Install dependencies
      if: matrix.packages
      run: |
        sudo apt update
        sudo apt install -y ${{ matrix.packages }}

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.check.outputs.sha }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Build project
      run: cargo build --workspace --release --target ${{ matrix.target }}

    - name: Run tests
      if: ${{ !matrix.skip-tests }}
      timeout-minutes: 20
      run: cargo test --workspace --release --target ${{ matrix.target }}

    - name: Package
      if: runner.os != 'Windows'
      run: |
        dir=proxyres-${{ inputs.version }}-${{ matrix.arch }}
        mkdir -p pkg/$dir
        cp target/${{ matrix.target }}/release/proxycli LICENSE.md README.md pkg/$dir/
        if [ "$RUNNER_OS" = "Linux" ]; then
          strip pkg/$dir/proxycli
        fi
        tar -czf $dir.tar.gz -C pkg $dir

    - name: Package (Windows)
      if: runner.os == 'Windows'
      run: |
        $dir = "proxyres-${{ inputs.version }}-${{ matrix.arch }}"
        New-Item -ItemType Directory -Path pkg/$dir | Out-Null
        Copy-Item target/${{ matrix.target }}/release/proxycli.exe, LICENSE.md, README.md pkg/$dir/
        Compress-Archive -Path pkg/$dir -DestinationPath "$dir.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.arch }}
        path: |
          *.tar.gz
          *.zip
        if-no-files-found: error

  release:
    name: Publish release
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    - name: Checksums
      run: cd dist && sha256sum * > SHA256SUMS.txt

    - name: Create the tagged release
      env:
        GH_TOKEN: ${{ github.token }}
      run: >
        gh release create ${{ inputs.version }} dist/*
        --repo ${{ github.repository }}
        --target ${{ needs.check.outputs.sha }}
        --title "proxyres-rs ${{ inputs.version }}"
        --generate-notes

  # The crate is published last since crates.io can't take a version back, so a failed
  # publish can be rerun against the tag that already exists.
  publish:
    name: Publish crate
    needs: [check, release]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.check.outputs.sha }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Publish to crates.io
      run: cargo publish -p proxyres
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
